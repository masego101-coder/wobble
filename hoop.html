
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#100b2b">
<title>HOOP | WOBBLE ARCADE</title>
<style>
:root {
  --bg:#100b2b;
  --panel:#211746;
  --panel2:#2c2058;
  --pink:#ff63bd;
  --gold:#ffd66b;
  --text:#fff;
  --muted:#c6bce7;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--text)}
body{
  min-height:100vh;
  overflow-x:hidden;
  background:
    radial-gradient(ellipse at 15% 10%,#49318a 0,transparent 38%),
    radial-gradient(ellipse at 90% 75%,#242b68 0,transparent 35%),
    linear-gradient(145deg,#100b2b,#17113b 55%,#0d1735);
  padding:12px 10px 28px;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;
  background-image:radial-gradient(#fff 1px,transparent 1px);
  background-size:34px 34px;
}
.page{position:relative;width:100%;max-width:620px;margin:auto}
header{text-align:center;margin:4px 0 12px}
.logo{font-size:clamp(30px,9vw,43px);font-weight:1000;letter-spacing:5px;color:#fff;text-shadow:0 3px 0 #8d43bd,0 0 22px #b65bff}
.subtitle{font-size:11px;letter-spacing:4px;color:#cbb8ff;margin-top:2px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}
.pill{background:#24194c;border:1px solid #59468d;border-radius:18px;padding:9px 13px;font-size:13px;font-weight:800;box-shadow:0 5px 14px #07051a66}
.pill span{color:var(--gold)}
.level-area{display:flex;justify-content:center;align-items:center;gap:9px;margin:8px 0 12px}
.level-area label{font-size:13px;color:var(--muted);font-weight:bold}
select{
  background:#30225d;color:#fff;border:1px solid #7964b5;border-radius:12px;
  padding:9px 13px;font-weight:bold;font-size:14px;max-width:160px
}
.progress{height:7px;border-radius:9px;background:#ffffff20;overflow:hidden;margin:0 4px 13px}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#ff65be,#ffd66b);border-radius:9px;transition:width .25s}
.message{text-align:center;min-height:22px;color:#e1d7ff;font-size:13px;font-weight:700;margin:8px 0}
.board{
  width:100%;padding:17px 10px 19px;border-radius:24px;
  background:linear-gradient(145deg,#34265fdd,#1c1745ee);
  border:1px solid #7760a7;box-shadow:0 15px 35px #05031588,inset 0 2px 12px #ffffff12;
}
.sticks{
  width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:22px 7px;align-items:end;justify-items:center;
}
.stick{
  width:100%;min-width:0;min-height:190px;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  border:0;background:transparent;padding:0 1px 5px;touch-action:none;
  -webkit-tap-highlight-color:transparent;
}
.stick:focus-visible{outline:2px solid white;border-radius:12px}
.rod{
  position:absolute;bottom:13px;width:9px;height:146px;border-radius:8px;
  background:linear-gradient(90deg,#aeb9d5,#fff 40%,#c9d4ed 75%,#7c8caf);
  box-shadow:2px 3px 6px #05051b88;z-index:0;
}
.base{
  position:absolute;bottom:7px;width:88%;height:13px;border-radius:50%;
  background:linear-gradient(180deg,#fff,#a8b4d2 50%,#59658c);
  box-shadow:0 4px 6px #08051e;z-index:1;
}
.hoop-stack{
  width:100%;display:flex;flex-direction:column-reverse;align-items:center;
  position:relative;z-index:2;min-height:0;padding-bottom:14px;pointer-events:none;
}
.hoop{
  position:relative;width:min(100%,76px);height:31px;flex:none;margin-top:-3px;
  border-radius:50% / 42%;
  border:3px solid #ffffff65;
  box-shadow:0 4px 5px #09051d99,inset 0 3px 3px #ffffff75,inset 0 -5px 5px #00000030;
}
.hoop:before{
  content:"";position:absolute;left:18%;right:18%;top:5px;height:9px;
  border-radius:50%;background:#160d36;
  box-shadow:inset 0 2px 3px #000,0 1px 1px #ffffff70;
}
.hoop:after{
  content:"";position:absolute;left:13%;right:13%;top:2px;height:5px;
  border-radius:50%;background:#ffffff55;
}
.stick.selected .hoop-stack .hoop:first-child{filter:brightness(1.3)}
.stick.selected .base{box-shadow:0 0 0 3px var(--gold),0 4px 10px #000}
.stick.target .base{box-shadow:0 0 0 3px #75f4c4,0 4px 10px #000}
.stick-number{position:absolute;bottom:-13px;font-size:10px;color:#a99bcf}
.stick.drag-over .base{box-shadow:0 0 0 3px #75f4c4}
.empty-label{font-size:9px;color:#a99bcf;position:absolute;bottom:25px;pointer-events:none}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:14px 0 0}
.action{
  min-height:44px;border:1px solid #7661a9;border-radius:13px;
  color:#fff;background:linear-gradient(180deg,#453477,#2c2058);
  font-size:12px;font-weight:800;padding:9px 7px;
  box-shadow:0 4px 0 #17102f;cursor:pointer;touch-action:manipulation
}
.action:active{transform:translateY(2px);box-shadow:0 2px 0 #17102f}
.action small{display:block;font-size:10px;color:#f6d98b;margin-top:3px}
.action.primary{background:linear-gradient(180deg,#ff79c8,#d63c9c);border-color:#ffb0dc}
.action:disabled{opacity:.42;filter:grayscale(.6);cursor:not-allowed}
.hint{text-align:center;color:#bfb4e2;font-size:11px;line-height:1.5;margin:14px 5px 0}
.overlay{
  position:fixed;inset:0;background:#09051ddd;z-index:20;display:none;
  align-items:center;justify-content:center;padding:20px
}
.overlay.show{display:flex}
.modal{
  width:min(100%,360px);text-align:center;padding:25px 20px;border-radius:23px;
  background:linear-gradient(145deg,#382565,#1d1746);
  border:1px solid #a48bd7;box-shadow:0 15px 45px #0009
}
.modal h2{font-size:27px;margin:0 0 8px;color:#ffb7e1}
.modal p{color:#e0d7f7;font-size:14px;line-height:1.5}
.modal button{width:100%;margin-top:10px}
@media(max-width:380px){
  body{padding:9px 7px 22px}
  .board{padding:14px 7px 17px;border-radius:20px}
  .sticks{column-gap:4px;row-gap:18px}
  .stick{min-height:178px}
  .rod{height:137px;width:8px}
  .hoop{height:30px;width:min(100%,70px)}
  .action{font-size:11px;padding:8px 4px}
}
@media(min-width:520px){
  .sticks{column-gap:13px;row-gap:25px}
  .stick{min-height:205px}
  .hoop{height:34px;width:min(100%,88px)}
  .rod{height:158px}
}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="logo">HOOP</div>
    <div class="subtitle">A WOBBLE ARCADE GAME</div>
  </header>

  <div class="topbar">
    <div class="pill">🪙 <span id="coins">0</span> coins</div>
    <div class="pill">🏆 Best: <span id="best">1</span></div>
  </div>

  <div class="level-area">
    <label for="levelSelect">LEVEL</label>
    <select id="levelSelect" aria-label="Choose unlocked level"></select>
  </div>
  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  <div class="message" id="message">Sort the hoops by colour!</div>

  <main class="board">
    <div class="sticks" id="sticks"></div>
  </main>

  <div class="controls">
    <button class="action" id="undoBtn">↶ Undo <small id="undoInfo">3 free per level</small></button>
    <button class="action" id="restartBtn">⟳ Restart <small>Free</small></button>
    <button class="action" id="switchBtn">⇄ Switch Hoops <small>150 coins</small></button>
    <button class="action" id="extraBtn">＋ Add Stick <small>150 coins</small></button>
  </div>
  <div class="hint" id="hint">
    Move a top hoop onto an empty stick or a stick with the same top colour.
    Complete each colour stack to win!
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Level complete!</h2>
    <p id="modalText">Great job!</p>
    <button class="action primary" id="nextBtn">Next Level</button>
    <button class="action" id="replayBtn">Play this level again</button>
  </div>
</div>

<script>
(() => {
"use strict";

const STORAGE_KEY = "wobbleHoopProgress";
const COLOURS = [
  "#ff557f","#35c9f2","#ffd34e","#9b72ff",
  "#55dc9b","#ff944d","#f06bd1","#9bd94c"
];

const $ = id => document.getElementById(id);
const clone = board => board.map(stack => [...stack]);

function readProgress(){
  try{
    const old = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    return {
      level: Math.max(1, Number(old.level) || 1),
      unlockedLevel: Math.max(1, Number(old.unlockedLevel) || Number(old.level) || 1),
      coins: Math.max(0, Number(old.coins) || 0),
      completedLevels: Array.isArray(old.completedLevels) ? old.completedLevels : [],
      best: Math.max(1, Number(old.best) || Number(old.unlockedLevel) || 1)
    };
  }catch(e){
    return {level:1,unlockedLevel:1,coins:0,completedLevels:[],best:1};
  }
}
let progress = readProgress();

function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));
  }catch(e){}
}

function capacity(){
  if(progress.level<=3)return 4;
  if(progress.level<=6)return 5;
  if(progress.level<=9)return 6;
  return 7;
}
function colourCount(){
  if(progress.level<=3)return 3;
  if(progress.level<=6)return 4;
  if(progress.level<=9)return 5;
  return 6;
}
function stickCount(){
  if(progress.level<=3)return 4;
  if(progress.level<=6)return 5;
  if(progress.level<=9)return 6;
  return 7;
}
function reward(){
  return Math.min(200,60 + Math.floor((progress.level-1)/3)*15);
}

let board = [];
let startingBoard = [];
let history = [];
let freeUndos = 3;
let extraStickActive = false;
let switchMode = false;
let switchFirst = null;
let selectedStick = null;
let levelWon = false;

function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

/* Create a puzzle by reversing legal moves from a solved board.
   Each reverse move can be undone by a legal forward move. */
function makePuzzle(){
  const count = colourCount();
  const cap = capacity();
  const totalSticks = stickCount();
  const solved = Array.from({length:totalSticks},(_,i)=>i<count?Array(cap).fill(i):[]);
  let puzzle = clone(solved);
  let lastFrom = -1;
  let lastTo = -1;
  const steps = Math.max(18,progress.level*7);

  for(let step=0;step<steps;step++){
    const options=[];
    for(let from=0;from<puzzle.length;from++){
      if(!puzzle[from].length)continue;
      for(let to=0;to<puzzle.length;to++){
        if(to===from || puzzle[to].length>=cap)continue;
        if(puzzle[from].length>1 &&
           puzzle[from][puzzle[from].length-2]!==puzzle[from][puzzle[from].length-1])continue;
        if(puzzle[to].length && puzzle[to][puzzle[to].length-1]===puzzle[from][puzzle[from].length-1])continue;
        if(from===lastTo && to===lastFrom)continue;
        options.push([from,to]);
      }
    }
    if(!options.length)break;
    const [from,to]=options[Math.floor(Math.random()*options.length)];
    puzzle[to].push(puzzle[from].pop());
    lastFrom=from;lastTo=to;
  }
  return puzzle;
}

function setupLevel(){
  board=makePuzzle();
  startingBoard=clone(board);
  history=[];
  freeUndos=3;
  extraStickActive=false;
  switchMode=false;
  switchFirst=null;
  selectedStick=null;
  levelWon=false;
  $("overlay").classList.remove("show");
  $("message").textContent="Sort the hoops by colour!";
  render();
}

function render(){
  const root=$("sticks");
  root.innerHTML="";
  board.forEach((stack,index)=>{
    const stick=document.createElement("button");
    stick.type="button";
    stick.className="stick";
    stick.dataset.index=index;
    stick.setAttribute("aria-label","Stick "+(index+1)+", "+stack.length+" hoops");
    if(selectedStick===index)stick.classList.add("selected");
    if(switchFirst===index)stick.classList.add("target");

    const rod=document.createElement("span");
    rod.className="rod";
    const base=document.createElement("span");
    base.className="base";
    const stackEl=document.createElement("span");
    stackEl.className="hoop-stack";

    stack.forEach(colourIndex=>{
      const hoop=document.createElement("span");
      hoop.className="hoop";
      hoop.style.background=
        `linear-gradient(180deg,${lighten(COLOURS[colourIndex])},${COLOURS[colourIndex]} 48%,${darken(COLOURS[colourIndex])})`;
      hoop.dataset.colour=colourIndex;
      stackEl.appendChild(hoop);
    });

    stick.append(rod,stackEl,base);
    if(stack.length===0){
      const empty=document.createElement("span");
      empty.className="empty-label";
      empty.textContent="EMPTY";
      stick.appendChild(empty);
    }
    const number=document.createElement("span");
    number.className="stick-number";
    number.textContent=index+1;
    stick.appendChild(number);

    stick.addEventListener("click",()=>handleStick(index));
    root.appendChild(stick);
  });

  $("coins").textContent=progress.coins;
  $("best").textContent=progress.best;
  $("levelSelect").value=String(progress.level);
  $("progressFill").style.width=(board.filter(s=>isCompleteStack(s)).length/colourCount()*100)+"%";
  $("undoInfo").textContent=freeUndos>0?freeUndos+" free left":"75 coins";
  $("undoBtn").disabled=history.length===0;
  $("switchBtn").textContent=switchMode?"Cancel Switch":"⇄ Switch Hoops";
  $("switchBtn").innerHTML=switchMode?"Cancel Switch <small>Choose two top hoops</small>":"⇄ Switch Hoops <small>150 coins</small>";
  $("extraBtn").disabled=extraStickActive;
  $("extraBtn").innerHTML=extraStickActive?"＋ Stick Added <small>This level only</small>":"＋ Add Stick <small>150 coins</small>";
  $("levelSelect").innerHTML="";
  for(let i=1;i<=progress.unlockedLevel;i++){
    const option=document.createElement("option");
    option.value=i;
    option.textContent="Level "+i;
    $("levelSelect").appendChild(option);
  }
  $("levelSelect").value=String(progress.level);
}

function lighten(hex){
  const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,((n>>16)&255)+55);
  const g=Math.min(255,((n>>8)&255)+55);
  const b=Math.min(255,(n&255)+55);
  return `rgb(${r},${g},${b})`;
}
function darken(hex){
  const n=parseInt(hex.slice(1),16);
  const r=Math.max(0,((n>>16)&255)-55);
  const g=Math.max(0,((n>>8)&255)-55);
  const b=Math.max(0,(n&255)-55);
  return `rgb(${r},${g},${b})`;
}
function isCompleteStack(stack){
  return stack.length>0 &&
    stack.length===capacity() &&
    stack.every(colour=>colour===stack[0]);
}
function canMove(from,to){
  if(from===to || !board[from] || !board[from].length)return false;
  if(board[to].length>=capacity())return false;
  if(board[to].length===0)return true;
  return board[to][board[to].length-1]===board[from][board[from].length-1];
}
function remember(){
  history.push({
    board:clone(board),
    freeUndos,
    extraStickActive,
    startingBoard:clone(startingBoard)
  });
}
function handleStick(index){
  if(levelWon)return;
  if(switchMode){
    handleSwitch(index);
    return;
  }
  if(selectedStick===null){
    if(board[index].length){
      selectedStick=index;
      $("message").textContent="Now choose where to move the top hoop.";
      render();
    }
    return;
  }
  if(selectedStick===index){
    selectedStick=null;
    $("message").textContent="Choose a hoop to move.";
    render();
    return;
  }
  const from=selectedStick;
  selectedStick=null;
  if(canMove(from,index)){
    remember();
    board[index].push(board[from].pop());
    $("message").textContent="Nice move!";
    render();
    checkWin();
  }else{
    if(board[index].length){
      selectedStick=index;
      $("message").textContent="That move isn't allowed. Choose another stick.";
    }else{
      $("message").textContent="That move isn't allowed.";
    }
    render();
  }
}

function handleSwitch(index){
  if(switchFirst===null){
    if(!board[index].length){
      $("message").textContent="Choose a stick with a hoop on top.";
      return;
    }
    switchFirst=index;
    $("message").textContent="Now choose a second stick with a top hoop.";
    render();
    return;
  }
  if(index===switchFirst){
    switchFirst=null;
    $("message").textContent="Choose the first hoop again.";
    render();
    return;
  }
  if(!board[index].length){
    $("message").textContent="Choose a second stick with a top hoop.";
    return;
  }
  remember();
  const a=board[switchFirst].length-1;
  const b=board[index].length-1;
  [board[switchFirst][a],board[index][b]]=
    [board[index][b],board[switchFirst][a]];
  switchMode=false;
  switchFirst=null;
  $("message").textContent="Hoops switched!";
  render();
  checkWin();
}

function undo(){
  if(!history.length)return;
  if(freeUndos<=0 && progress.coins<75){
    $("message").textContent="You need 75 coins for another Undo.";
    return;
  }
  if(freeUndos<=0)progress.coins-=75;
  const previous=history.pop();
  board=clone(previous.board);
  freeUndos=previous.freeUndos;
  extraStickActive=previous.extraStickActive;
  startingBoard=clone(previous.startingBoard);
  switchMode=false;
  switchFirst=null;
  selectedStick=null;
  levelWon=false;
  saveProgress();
  $("message").textContent="Last move undone.";
  render();
}

function restart(){
  board=clone(startingBoard);
  history=[];
  freeUndos=3;
  switchMode=false;
  switchFirst=null;
  selectedStick=null;
  levelWon=false;
  $("overlay").classList.remove("show");
  $("message").textContent="Level restarted. Try a new approach!";
  render();
}

function buyExtraStick(){
  if(extraStickActive || levelWon)return;
  if(progress.coins<150){
    $("message").textContent="You need 150 coins to add a stick.";
    return;
  }
  remember();
  progress.coins-=150;
  board.push([]);
  startingBoard.push([]);
  extraStickActive=true;
  saveProgress();
  $("message").textContent="An extra empty stick has been added!";
  render();
}

function toggleSwitch(){
  if(levelWon)return;
  if(switchMode){
    switchMode=false;
    switchFirst=null;
    $("message").textContent="Switch cancelled.";
    render();
    return;
  }
  if(progress.coins<150){
    $("message").textContent="You need 150 coins to switch hoops.";
    return;
  }
  progress.coins-=150;
  saveProgress();
  switchMode=true;
  switchFirst=null;
  selectedStick=null;
  $("message").textContent="Choose the first top hoop to switch.";
  render();
}

function checkWin(){
  const allSorted=board.every(stack=>stack.length===0 || isCompleteStack(stack));
  const completeCount=board.filter(isCompleteStack).length;
  $("progressFill").style.width=(completeCount/colourCount()*100)+"%";
  if(allSorted && completeCount===colourCount()){
    finishLevel();
  }
}
function finishLevel(){
  if(levelWon)return;
  levelWon=true;
  const prize=reward();
  if(!progress.completedLevels.includes(progress.level)){
    progress.coins+=prize;
    progress.completedLevels.push(progress.level);
  }
  progress.unlockedLevel=Math.max(progress.unlockedLevel,progress.level+1);
  progress.best=Math.max(progress.best,progress.unlockedLevel);
  saveProgress();
  $("coins").textContent=progress.coins;
  $("best").textContent=progress.best;
  $("modalTitle").textContent="🎉 Level complete!";
  $("modalText").textContent="Beautifully sorted! You earned "+(progress.completedLevels.includes(progress.level)?"your level reward":"")+" "+prize+" coins.";
  $("nextBtn").style.display="block";
  $("overlay").classList.add("show");
}
function nextLevel(){
  progress.level++;
  saveProgress();
  setupLevel();
}
function replayLevel(){
  setupLevel();
}
function changeLevel(){
  const chosen=Number($("levelSelect").value);
  if(chosen>=1 && chosen<=progress.unlockedLevel){
    progress.level=chosen;
    saveProgress();
    setupLevel();
  }
}

$("undoBtn").addEventListener("click",undo);
$("restartBtn").addEventListener("click",restart);
$("switchBtn").addEventListener("click",toggleSwitch);
$("extraBtn").addEventListener("click",buyExtraStick);
$("levelSelect").addEventListener("change",changeLevel);
$("nextBtn").addEventListener("click",nextLevel);
$("replayBtn").addEventListener("click",replayLevel);

setupLevel();
})();
</script>
</body>
</html>
